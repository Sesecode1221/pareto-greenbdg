<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GreenBDG Africa | Pareto Energy Intelligence</title>
    
    <!-- Chart.js for visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <style>
        /* ============================================================
           CSS VARIABLES - GreenBDG Theme
           ============================================================ */
        :root {
            --primary: #059669;
            --primary-dark: #047857;
            --primary-light: #10b981;
            --primary-bg: #ecfdf5;
            --bg: #f0fdf4;
            --surface: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
            --radius: 12px;
            --radius-lg: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 240px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--surface);
            border-right: 1px solid var(--border);
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: transform var(--transition);
            overflow-y: auto;
        }

        .sidebar-logo {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        .sidebar-logo-text {
            font-weight: 800;
            font-size: 20px;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .sidebar-logo-sub {
            font-size: 9px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            display: block;
            margin-top: -2px;
        }

        .sidebar-nav {
            flex: 1;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            width: 100%;
            text-align: left;
        }

        .sidebar-nav-item:hover {
            background: var(--primary-bg);
            color: var(--primary);
        }

        .sidebar-nav-item.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
        }

        .sidebar-nav-item i {
            width: 20px;
            text-align: center;
            font-size: 15px;
        }

        .sidebar-nav-item .badge {
            margin-left: auto;
            font-size: 9px;
            background: rgba(5, 150, 105, 0.15);
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
        }

        .sidebar-nav-item.active .badge {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            background: #fafafa;
        }

        .sidebar-footer-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-footer-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-bg);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .sidebar-footer-info { flex: 1; min-width: 0; }
        .sidebar-footer-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-footer-role { font-size: 11px; color: var(--text-secondary); }
        .sidebar-footer-select { margin-top: 10px; width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: white; color: var(--text); outline: none; cursor: pointer; transition: border var(--transition); }
        .sidebar-footer-select:focus { border-color: var(--primary); }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 24px 32px 32px;
            min-height: 100vh;
            transition: margin var(--transition);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-header-title {
            font-size: 26px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.5px;
        }
        .page-header-title span { color: var(--primary); }
        .page-header-sub { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }

        .page-header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* WhatsApp FAB */
        .whatsapp-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #25D366;
            color: white;
            border: none;
            font-size: 28px;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4);
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        .whatsapp-fab:hover { transform: scale(1.1); box-shadow: 0 6px 24px rgba(37, 211, 102, 0.5); }
        .whatsapp-fab .dot {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 22px;
            height: 22px;
            background: #ef4444;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        /* WhatsApp Panel */
        .whatsapp-panel {
            position: fixed;
            bottom: 100px;
            right: 30px;
            width: 400px;
            height: 560px;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.2);
            z-index: 999;
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }
        .whatsapp-panel.active { display: flex; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wa-header {
            padding: 14px 20px;
            background: #075E54;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .wa-header h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 10px; }
        .wa-header .close { background: none; border: none; color: white; font-size: 22px; cursor: pointer; opacity: 0.7; }
        .wa-header .close:hover { opacity: 1; }

        .wa-filters {
            padding: 10px 16px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 8px;
        }
        .wa-filters select {
            flex: 1;
            padding: 5px 10px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            font-size: 11px;
            background: white;
        }

        .wa-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        .wa-msg {
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-left: 3px solid #25D366;
            transition: background 0.2s;
        }
        .wa-msg:hover { background: #f1f3f5; }
        .wa-msg .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; }
        .wa-msg .centre { font-weight: 700; font-size: 12px; color: #075E54; }
        .wa-msg .sender { font-size: 11px; color: #6c757d; }
        .wa-msg .time { font-size: 10px; color: #adb5bd; }
        .wa-msg .text { font-size: 13px; color: #212529; margin: 3px 0; }
        .wa-msg .prio { font-size: 9px; padding: 1px 8px; border-radius: 10px; font-weight: 600; }
        .prio-critical { background: #fee2e2; color: #991b1b; }
        .prio-high { background: #fef3c7; color: #92400e; }
        .prio-medium { background: #dbeafe; color: #1e40af; }
        .prio-normal { background: #dcfce7; color: #166534; }

        .wa-input {
            padding: 12px 16px;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 8px;
        }
        .wa-input input {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid #dee2e6;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
        }
        .wa-input input:focus { border-color: #25D366; }
        .wa-input button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #25D366;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .wa-input button:hover { background: #1da851; }

        .wa-hint {
            padding: 6px 20px;
            font-size: 10px;
            color: var(--text-light);
            border-top: 1px solid var(--border);
            background: var(--primary-bg);
        }

        /* ============================================================
           CARDS & COMPONENTS
           ============================================================ */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-lg); }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 16px; }
        .card-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 20px;
            background: var(--primary-bg);
            color: var(--primary);
            margin-left: auto;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

        .metric-card {
            padding: 18px 20px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            background: var(--surface);
            transition: all var(--transition);
        }
        .metric-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
        .metric-card .icon { font-size: 24px; margin-bottom: 6px; }
        .metric-card .value { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
        .metric-card .label { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
        .metric-card .trend { font-size: 12px; font-weight: 600; margin-top: 4px; }
        .metric-card .trend.up { color: #ef4444; }
        .metric-card .trend.down { color: var(--primary); }
        .metric-card.green { background: var(--primary-bg); border-color: var(--primary); }
        .metric-card.green .value { color: var(--primary); }

        .badge { display: inline-block; padding: 2px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-primary { background: var(--primary-bg); color: var(--primary); }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 4px 16px rgba(5, 150, 105, 0.3); transform: translateY(-1px); }
        .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-bg); }
        .btn-sm { padding: 6px 16px; font-size: 12px; }
        .btn-block { width: 100%; justify-content: center; }

        .table-container { overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .table th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); }
        .table td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
        .table tr:hover td { background: var(--primary-bg); }

        .hero-banner {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: var(--radius-lg);
            padding: 28px 36px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .hero-banner h1 { font-size: 22px; font-weight: 800; }
        .hero-banner p { color: rgba(255, 255, 255, 0.8); margin-top: 4px; }
        .hero-banner .btn { background: rgba(255, 255, 255, 0.2); color: white; backdrop-filter: blur(8px); }
        .hero-banner .btn:hover { background: rgba(255, 255, 255, 0.3); }

        .chart-container { position: relative; height: 250px; width: 100%; }
        .chart-container-sm { height: 200px; }

        .insight-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px;
            background: var(--primary-bg);
            border-radius: var(--radius);
            border: 1px solid rgba(5, 150, 105, 0.15);
            margin-bottom: 12px;
        }
        .insight-item .num {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
        }
        .insight-item .content { flex: 1; }
        .insight-item .content h4 { font-size: 14px; font-weight: 600; }
        .insight-item .content p { font-size: 13px; color: var(--text-secondary); }
        .insight-item .action {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            background: none;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
        }
        .insight-item .action:hover { text-decoration: underline; }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            padding: 14px 28px;
            border-radius: var(--radius);
            background: var(--text);
            color: white;
            font-weight: 500;
            box-shadow: var(--shadow-lg);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 999;
            max-width: 500px;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--primary); }
        .toast.error { background: #ef4444; }
        .toast.info { background: #3b82f6; }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 200;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            cursor: pointer;
            font-size: 20px;
            box-shadow: var(--shadow);
        }
        .menu-toggle:hover { background: var(--primary-bg); }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 99;
        }
        .sidebar-overlay.active { display: block; }

        .page-content { animation: slideUp 0.4s ease-out forwards; }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 1024px) { .grid-2 { grid-template-columns: 1fr; } .grid-3 { grid-template-columns: 1fr 1fr; } .grid-4 { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px; }
            .grid-3 { grid-template-columns: 1fr; }
            .grid-4 { grid-template-columns: 1fr 1fr; }
            .hero-banner { flex-direction: column; text-align: center; padding: 20px; }
            .page-header { flex-direction: column; }
            .page-header-actions { width: 100%; justify-content: flex-start; }
            .menu-toggle { display: flex !important; }
            .whatsapp-panel { width: calc(100% - 32px); right: 16px; bottom: 80px; height: 70vh; }
            .whatsapp-fab { right: 16px; bottom: 16px; width: 54px; height: 54px; font-size: 24px; }
        }
        @media (max-width: 480px) { .grid-4 { grid-template-columns: 1fr; } }

        .flex { display: flex; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .items-center { align-items: center; }
        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }
        .mt-2 { margin-top: 8px; }
        .mt-4 { margin-top: 16px; }
        .mb-4 { margin-bottom: 16px; }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .flex-wrap { flex-wrap: wrap; }
    </style>
</head>
<body>

    <!-- ============================================================
    MENU TOGGLE
    ============================================================ -->
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ============================================================
    SIDEBAR
    ============================================================ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">G</div>
            <div>
                <span class="sidebar-logo-text">GreenBDG</span>
                <span class="sidebar-logo-sub">Africa • Pareto</span>
            </div>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
            <button class="sidebar-nav-item active" data-view="overview"><i class="fas fa-chart-pie"></i> Overview</button>
            <button class="sidebar-nav-item" data-view="pareto"><i class="fas fa-chart-bar"></i> Pareto Analytics <span class="badge">NEW</span></button>
            <button class="sidebar-nav-item" data-view="buildings"><i class="fas fa-building"></i> Buildings</button>
            <button class="sidebar-nav-item" data-view="sustainability"><i class="fas fa-leaf"></i> Sustainability</button>
            <button class="sidebar-nav-item" data-view="iso"><i class="fas fa-certificate"></i> ISO Compliance</button>
            <button class="sidebar-nav-item" data-view="netzero"><i class="fas fa-globe-africa"></i> Net Zero</button>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-footer-user">
                <div class="sidebar-footer-avatar" id="userAvatar">PM</div>
                <div class="sidebar-footer-info">
                    <div class="sidebar-footer-name" id="userName">Portfolio Manager</div>
                    <div class="sidebar-footer-role">Pareto Limited</div>
                </div>
            </div>
            <select class="sidebar-footer-select" id="roleSelect">
                <option value="Portfolio Manager">Portfolio Manager</option>
                <option value="CFO">CFO</option>
                <option value="Sustainability Officer">Sustainability Officer</option>
                <option value="Facilities Manager">Facilities Manager</option>
                <option value="Tenant">Tenant</option>
            </select>
        </div>
    </aside>

    <!-- ============================================================
    WHATSAPP FAB + PANEL
    ============================================================ -->
    <button class="whatsapp-fab" id="whatsappFab">
        <i class="fab fa-whatsapp"></i>
        <span class="dot">3</span>
    </button>

    <div class="whatsapp-panel" id="whatsappPanel">
        <div class="wa-header">
            <h3><i class="fab fa-whatsapp"></i> Operations Feed</h3>
            <button class="close" id="waClose">&times;</button>
        </div>
        <div class="wa-filters">
            <select id="waCentreFilter"><option value="all">All Centres</option><option value="cresta">Cresta</option><option value="menlyn">Menlyn</option><option value="mimosa">Mimosa</option><option value="pavilion">Pavilion</option><option value="southgate">Southgate</option><option value="tygervalley">Tygervalley</option><option value="westgate">Westgate</option></select>
            <select id="waPriorityFilter"><option value="all">All Priorities</option><option value="critical">Critical</option><option value="high">High</option><option value="medium">Medium</option><option value="normal">Normal</option></select>
        </div>
        <div class="wa-messages" id="waMessages"></div>
        <div class="wa-input">
            <input type="text" id="waInput" placeholder="Type a message..." />

                    },
                    options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } },
                        scales: { x: { max: 100, grid: { color: 'rgba(0,0,0,0.05)' } }, y: { grid: { display: false } } } }
                });
            }
            const pieCtx = document.getElementById('paretoPieChart');
            if (pieCtx) {
                const dataKey = currentRole === 'CFO' ? 'cost' : 'emissions';
                chartInstances.paretoPie = new Chart(pieCtx, {
                    type: 'pie',
                    data: {
                        labels: paretoData.map(d => d.name),
                        datasets: [{ data: paretoData.map(d => d[dataKey]), backgroundColor: ['#059669', '#10b981',
                                '#34d399', '#6ee7b7', '#a7f3d0'
                            ], borderWidth: 0 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { usePointStyle: true, padding: 12, font: { size: 10 } } },
                            tooltip: {
                                callbacks: {
                                    label: (ctx) => {
                                        const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                                        const pct = ((ctx.parsed / total) * 100).toFixed(0);
                                        const val = currentRole === 'CFO' ? formatCurrency(ctx.parsed) : ctx.parsed +
                                            't CO₂e';
                                        return `${ctx.label}: ${val} (${pct}%)`;
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }

        // ============================================================
        // 7.3 BUILDINGS PAGE
        // ============================================================

        function renderBuildings() {
            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <div><h2 style="font-size:22px;font-weight:800;">🏢 Building Portfolio</h2>
                    <p style="color:var(--text-secondary);font-size:14px;">${centres.length} shopping centres across South Africa</p></div>
                    <button class="btn btn-primary" onclick="showToast('New centre form opened', 'info')"><i class="fas fa-plus"></i> Add Centre</button>
                </div>

                <div class="grid-3">
                    ${centres.map(c => `
                        <div class="card" style="cursor:pointer;" onclick="showToast('Loading ${c.name} details...', 'info')">
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                                <div><h4 style="font-weight:700;font-size:16px;">${c.name}</h4>
                                <p style="font-size:13px;color:var(--text-secondary);">${c.city}, ${c.province}</p></div>
                                <span class="badge ${getStatusBadge(c.status)}">${c.status}</span>
                            </div>
                            <div style="margin-top:14px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">
                                <div style="background:var(--primary-bg);padding:8px;border-radius:6px;text-align:center;">
                                    <div style="font-size:10px;color:var(--text-secondary);">Energy</div>
                                    <div style="font-weight:700;font-size:15px;">${c.energy.toLocaleString()}</div>
                                </div>
                                <div style="background:var(--primary-bg);padding:8px;border-radius:6px;text-align:center;">
                                    <div style="font-size:10px;color:var(--text-secondary);">EPC</div>
                                    <div style="font-weight:700;font-size:15px;"><span class="badge ${getEpcColor(c.epc)}">${c.epc}</span></div>
                                </div>
                                <div style="background:var(--primary-bg);padding:8px;border-radius:6px;text-align:center;">
                                    <div style="font-size:10px;color:var(--text-secondary);">Solar</div>
                                    <div style="font-weight:700;font-size:15px;">${c.solar.capacity}MW</div>
                                </div>
                            </div>
                            <div style="margin-top:10px;font-size:12px;color:var(--text-secondary);">
                                Water: ${c.water.variance > 0 ? '⚠️ +' : '✅ '}${Math.abs(c.water.variance)}% vs baseline
                                ${c.water.variance > 0 ? ' (above)' : ' (below)'}
                            </div>
                            <button style="margin-top:10px;width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-weight:600;color:var(--primary);transition:all var(--transition);"
                                    onmouseover="this.style.background='var(--primary-bg)'"
                                    onmouseout="this.style.background='transparent'"
                                    onclick="event.stopPropagation();showToast('Loading ${c.name} dashboard...', 'info')">
                                View Details →
                            </button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // ============================================================
        // 7.4 SUSTAINABILITY PAGE
        // ============================================================

        function renderSustainability() {
            const totalWater = centres.reduce((s, c) => s + c.water.actual, 0);
            const totalWaste = centres.reduce((s, c) => s + c.waste.kg, 0);
            const totalRecycled = centres.reduce((s, c) => s + c.waste.recycled, 0);
            const recycleRate = Math.round((totalRecycled / totalWaste) * 100);
            const totalSolar = centres.reduce((s, c) => s + c.solar.capacity, 0);

            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <div><h2 style="font-size:22px;font-weight:800;">🌿 Sustainability Performance</h2>
                    <p style="color:var(--text-secondary);font-size:14px;">Q1 FY2025 · Water, Solar, Waste & Carbon</p></div>
                    <button class="btn btn-primary" onclick="showToast('Sustainability report generated', 'success')"><i class="fas fa-download"></i> Download Report</button>
                </div>

                <div class="grid-4">
                    <div class="metric-card green"><div class="icon">💧</div><div class="value">${(totalWater/1000).toFixed(1)}k</div><div class="label">Water (kL)</div><div class="trend down">↓ 7.36% vs target</div></div>
                    <div class="metric-card"><div class="icon">☀️</div><div class="value">${totalSolar}MW</div><div class="label">Solar Capacity</div><div class="trend down">Target: 20.59MW</div></div>
                    <div class="metric-card"><div class="icon">♻️</div><div class="value">${recycleRate}%</div><div class="label">Recycling Rate</div><div class="trend down">Target: 51%</div></div>
                    <div class="metric-card"><div class="icon">🌿</div><div class="value">15,420t</div><div class="label">CO₂ Emissions</div><div class="trend down">↓ 4% YoY</div></div>
                </div>

                <div class="grid-2">
                    <div class="card">
                        <div class="card-title">💧 Water Performance <span class="card-badge">Q1 FY25</span></div>
                        <div class="card-subtitle">Actual vs baseline consumption</div>
                        <div class="chart-container"><canvas id="waterChart"></canvas></div>
                    </div>
                    <div class="card">
                        <div class="card-title">♻️ Waste Management <span class="card-badge">63% Recycled</span></div>
                        <div class="card-subtitle">Zero to landfill target: 2030</div>
                        <div class="chart-container"><canvas id="wasteChart"></canvas></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">☀️ Solar Performance <span class="card-badge">15.49 MW</span></div>
                    <div class="card-subtitle">Total savings: R35.4M · 99% forecast achievement</div>
                    <div class="table-container">
                        <table class="table">
                            <thead><tr><th>Centre</th><th>Capacity</th><th>Forecast (MWh)</th><th>Actual (MWh)</th><th>Efficiency</th></tr></thead>
                            <tbody>${centres.filter(c => c.solar.capacity > 0).map(c => `
                                <tr>
                                    <td><strong>${c.name}</strong></td>
                                    <td>${c.solar.capacity} MW</td>
                                    <td>${c.solar.forecast}</td>
                                    <td>${c.solar.actual}</td>
                                    <td><span class="badge ${c.solar.efficiency >= 90 ? 'badge-success' : c.solar.efficiency >= 70 ? 'badge-warning' : 'badge-danger'}">${c.solar.efficiency}%</span></td>
                                </tr>
                            `).join('')}</tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function initSustainabilityCharts() {
            const waterCtx = document.getElementById('waterChart');
            if (waterCtx) {
                chartInstances.water = new Chart(waterCtx, {
                    type: 'bar',
                    data: {
                        labels: centres.map(c => c.name),
                        datasets: [
                            { label: 'Baseline (kL)', data: centres.map(c => c.water.baseline), backgroundColor: '#94a3b8',
                                borderRadius: 4 },
                            { label: 'Actual (kL)', data: centres.map(c => c.water.actual), backgroundColor: '#059669',
                                borderRadius: 4 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top',
                                labels: { usePointStyle: true } } }, scales: { y: { beginAtZero: true,
                                grid: { color: 'rgba(0,0,0,0.05)' } }, x: { grid: { display: false } } } }
                });
            }
            const wasteCtx = document.getElementById('wasteChart');
            if (wasteCtx) {
                chartInstances.waste = new Chart(wasteCtx, {
                    type: 'bar',
                    data: {
                        labels: centres.map(c => c.name),
                        datasets: [
                            { label: 'Waste Produced (kg)', data: centres.map(c => c.waste.kg),
                                backgroundColor: '#f59e0b', borderRadius: 4 },
                            { label: 'Recycled (kg)', data: centres.map(c => c.waste.recycled),
                                backgroundColor: '#059669', borderRadius: 4 }
                        ]
                    },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top',
                                labels: { usePointStyle: true } } }, scales: { y: { beginAtZero: true,
                                grid: { color: 'rgba(0,0,0,0.05)' } }, x: { grid: { display: false } } } }
                });
            }
        }

        // ============================================================
        // 7.5 ISO COMPLIANCE PAGE
        // ============================================================

        function renderISO() {
            const done = isoMilestones.filter(m => m.done).length;
            const total = isoMilestones.length;
            const pct = Math.round((done / total) * 100);

            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <div><h2 style="font-size:22px;font-weight:800;">📋 ISO Compliance</h2>
                    <p style="color:var(--text-secondary);font-size:14px;">ISO 14001:2015 · Environmental Management System</p></div>
                    <div style="display:flex;gap:12px;">
                        <span class="badge badge-info">Pilot: Cresta</span>
                        <span class="badge badge-success">Target: April 2025</span>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="card">
                        <div class="card-title">📊 ISO 14001 Progress <span class="card-badge">${pct}%</span></div>
                        <div style="margin:16px 0;">
                            <div style="height:12px;background:#e2e8f0;border-radius:6px;overflow:hidden;">
                                <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#059669,#10b981);border-radius:6px;transition:width 0.6s;"></div>
                            </div>
                            <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--text-secondary);">
                                <span>${done}/${total} milestones</span>
                                <span>${pct}% Complete</span>
                            </div>
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
                            ${isoMilestones.map(m => `
                                <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:${m.done ? 'var(--primary-bg)' : '#f8f9fa'};border-radius:6px;font-size:12px;">
                                    <i class="fas ${m.done ? 'fa-check-circle' : 'fa-circle'}" style="color:${m.done ? '#059669' : '#cbd5e1'};"></i>
                                    <span style="${m.done ? 'color:var(--text);' : 'color:var(--text-secondary);'}">${m.name}</span>
                                    <span style="margin-left:auto;font-size:10px;color:var(--text-light);">${m.date}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div>
                        <div class="card" style="margin-bottom:16px;">
                            <div class="card-title">📋 ISO 9001:2015 <span class="card-badge">Planning</span></div>
                            <div class="card-subtitle">Quality Management System · Target: Sep 2025</div>
                            <div style="height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin:12px 0;">
                                <div style="height:100%;width:25%;background:#2563eb;border-radius:4px;"></div>
                            </div>
                            <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);">
                                <span>Initial Assessment ✅</span>
                                <span>GAP Analysis ⏳</span>
                                <span>Certification 🔜</span>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-title">📄 EMS Procedures <span class="card-badge">22 Documents</span></div>
                            <div style="max-height:200px;overflow-y:auto;font-size:12px;color:var(--text-secondary);">
                                ${['Definition of Roles', 'Environmental Policy', 'Risk Assessment', 'Training & Competence', 'Document Control', 'Communication', 'Carbon Assessment', 'Waste Management', 'Water Management', 'Energy Management', 'Air Quality', 'Noise Monitoring', 'Biodiversity', 'Pest Control', 'Green Building Policy', 'Emergency Response', 'Internal Audit', 'Monitoring & Measurement', 'Management Review', 'Non-conformance'].map(p => `
                                    <div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid #f1f5f9;">
                                        <i class="fas fa-file-alt" style="color:#059669;font-size:10px;"></i>
                                        <span>${p}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // 7.6 NET ZERO PAGE
        // ============================================================

        function renderNetZero() {
            return `
                <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;">
                    <div><h2 style="font-size:22px;font-weight:800;">🌍 Net Zero & ESG Strategy</h2>
                    <p style="color:var(--text-secondary);font-size:14px;">Progress against 2050 Net Zero target</p></div>
                    <span class="badge badge-primary">18% Achieved</span>
                </div>

                <div class="grid-2">
                    <div class="card">
                        <div class="card-title">🎯 Net Zero Roadmap</div>
                        ${netZeroMilestones.map(m => `
                            <div style="margin-bottom:16px;">
                                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                                    <span style="font-weight:700;font-size:15px;">${m.year}</span>
                                    <span style="font-size:13px;color:var(--text-secondary);">${m.target}</span>
                                    <span class="badge ${m.status === 'On Track' ? 'badge-success' : m.status === 'In Progress' ? 'badge-warning' : 'badge-info'}">${m.status}</span>
                                </div>
                                <div style="height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;">
                                    <div style="height:100%;width:${parseInt(m.achieved) || 15}%;background:${m.status === 'On Track' ? '#059669' : m.status === 'In Progress' ? '#f59e0b' : '#94a3b8'};border-radius:3px;"></div>
                                </div>
                                <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-top:2px;">
                                    <span>Achieved: ${m.achieved}</span>
                                    <span>${m.status}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div>
                        <div class="card" style="margin-bottom:16px;">
                            <div class="card-title">🌿 Environmental <span class="card-badge">45%</span></div>
                            <div style="height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin:8px 0;">
                                <div style="height:100%;width:45%;background:#059669;border-radius:3px;"></div>
                            </div>
                            <div style="font-size:13px;color:var(--text-secondary);">
                                <div>💧 Water Efficiency: <span class="badge badge-warning">7.36% above target</span></div>
                                <div>☀️ Solar Expansion: <span class="badge badge-info">15.49 / 20.59 MW</span></div>
                                <div>♻️ Waste Diversion: <span class="badge badge-warning">63% recycled</span></div>
                            </div>
                        </div>

                        <div class="card" style="margin-bottom:16px;">
                            <div class="card-title">👥 Social <span class="card-badge">30%</span></div>
                            <div style="height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin:8px 0;">
                                <div style="height:100%;width:30%;background:#2563eb;border-radius:3px;"></div>
                            </div>
                            <div style="font-size:13px;color:var(--text-secondary);">
                                <div>🏆 B-BBEE Level: <span class="badge badge-success">Level 2</span></div>
                                <div>👩‍💼 Women in Leadership: <span class="badge badge-warning">44%</span></div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-title">⚖️ Governance <span class="card-badge">60%</span></div>
                            <div style="height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin:8px 0;">
                                <div style="height:100%;width:60%;background:#7c3aed;border-radius:3px;"></div>
                            </div>
                            <div style="font-size:13px;color:var(--text-secondary);">
                                <div>📋 ISO 14001: <span class="badge badge-warning">${Math.round(isoMilestones.filter(m=>m.done).length/isoMilestones.length*100)}%</span></div>
                                <div>📊 ESG Reporting: <span class="badge badge-success">GRESB Ready</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // ============================================================
        // 8. EVENT BINDING
        // ============================================================

        $$('.sidebar-nav-item').forEach(el => {
            el.addEventListener('click', () => setActiveView(el.dataset.view));
        });

        roleSelect.addEventListener('change', function() {
            currentRole = this.value;
            userAvatar.textContent = getInitials(currentRole);
            userName.textContent = currentRole;
            renderPage(currentView);
            showToast(`Switched to ${currentRole} view`, 'info');
        });

        menuToggle.addEventListener('click', toggleMobileMenu);
        overlay.addEventListener('click', closeMobileMenu);

        actionBtn.addEventListener('click', function() {
            const actions = {
                overview: () => showToast('Exporting portfolio report...', 'success'),
                pareto: () => showToast('Re-running Pareto analysis...', 'info'),
                buildings: () => showToast('Opening add centre form...', 'info'),
                sustainability: () => showToast('Downloading sustainability report...', 'success'),
                iso: () => showToast('Uploading evidence...', 'info'),
                netzero: () => showToast('Viewing roadmap...', 'info'),
            };
            if (actions[currentView]) actions[currentView]();
        });

        // WhatsApp
        waFab.addEventListener('click', toggleWA);
        waClose.addEventListener('click', toggleWA);
        waSend.addEventListener('click', sendWAMessage);
        waInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendWAMessage(); });
        waCentreFilter.addEventListener('change', renderWAMessages);
        waPriorityFilter.addEventListener('change', renderWAMessages);

        // Toast click to dismiss
        toast.addEventListener('click', () => toast.classList.remove('show'));

        // ============================================================
        // 9. INIT
        // ============================================================

        userAvatar.textContent = getInitials(currentRole);
        userName.textContent = currentRole;
        setActiveView('overview');

        // Expose functions globally
        window.setActiveView = setActiveView;
        window.showToast = showToast;
        window.renderPage = renderPage;
        window.toggleWA = toggleWA;
        window.sendWAMessage = sendWAMessage;
        window.formatCurrency = formatCurrency;

        console.log('🌿 GreenBDG Pareto Platform initialized successfully!');
        console.log(`🏢 ${centres.length} shopping centres loaded`);
        console.log(`⚡ Total energy: ${centres.reduce((s,c)=>s+c.energy,0).toLocaleString()} kWh`);
        console.log(`💧 Total water: ${centres.reduce((s,c)=>s+c.water.actual,0).toLocaleString()} kL`);
        console.log(`☀️ Total solar: ${centres.reduce((s,c)=>s+c.solar.capacity,0)} MW`);
        console.log(`♻️ Recycling rate: ${Math.round(centres.reduce((s,c)=>s+c.waste.recycled,0)/centres.reduce((s,c)=>s+c.waste.kg,0)*100)}%`);
    </script>
</body>
</html>
